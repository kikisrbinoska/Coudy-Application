spring.application.name=coudy
server.port=9096
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quizdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


azure.ai.endpoint=${AZURE_AI_ENDPOINT:}
azure.ai.api-key=${AZURE_AI_API_KEY:${API_KEY:}}
azure.ai.model=${AZURE_AI_MODEL:}


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
